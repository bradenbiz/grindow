name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Swift tests
        run: swift test

      # The recorder only runs on a Mac with a trackpad; make sure it still compiles.
      - name: Type-check touch recorder
        run: swiftc -typecheck Scripts/record-touches.swift

      - name: Native C tests
        run: sh Scripts/test-native.sh

      # No signing identity exists on the runner. The build is universal so the
      # Intel macOS VM on Lisbon (Scripts/vm, docs in TESTING-VM.md) can run it.
      - name: Build app (unsigned, universal)
        run: |
          xcodebuild -project Grindow.xcodeproj -target Grindow -configuration Debug \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= build
          lipo -info build/Debug/Grindow.app/Contents/MacOS/Grindow

      - name: Package app
        run: ditto -c -k --keepParent build/Debug/Grindow.app Grindow.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Grindow-app
          path: Grindow.app.zip
          retention-days: 14
